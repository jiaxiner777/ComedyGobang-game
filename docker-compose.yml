version: '3.8'

services:
  comedy-gobang:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comedy-gobang.rule=Host(`comedy-gobang.localhost`)"
      - "traefik.http.services.comedy-gobang.loadbalancer.server.port=8080"
